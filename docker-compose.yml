services:
    private_polimer:
        build:
            context: .
            dockerfile: ./docker/dockerfile/app.Dockerfile
        restart: unless-stopped
        tty: true
        volumes:
            - ./:/var/www
        networks:
            - bbkkp_network
        ports:
            - "4900:80"
        depends_on:
            - mysql

    mysql:
        image: mysql:8.0
        container_name: private-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: private_polimer
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: bbkkp
            MYSQL_PASSWORD: bbkkp_password
        ports:
            - "3308:3306"
        volumes:
            - private_mysql_data:/var/lib/mysql
        networks:
            - bbkkp_network

    minio:
        image: minio/minio:latest
        container_name: private-minio
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: miniopassword123
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - private_minio_data:/data
        command: server /data --console-address ":9001"
        networks:
            - bbkkp_network

networks:
    bbkkp_network:
        external: true

volumes:
    private_mysql_data:
    private_minio_data:
