[program:nginx]
process_name=%(program_name)s_%(process_num)02d
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
startsecs = 2
autorestart=true
numprocs=1
user=root
stdout_logfile=/var/www/storage/logs/nginx-stdout.log
stderr_logfile=/var/www/storage/logs/nginx-stderr.log
redirect_stderr=true
